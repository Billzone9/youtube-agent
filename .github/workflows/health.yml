# CI health gate (D5). Runs the SAME `make health` suite as local, on an EPHEMERAL Postgres that has
# none of a dev Mac's state — so CI must SEED a known baseline (migrate + seed the wildlife channel +
# dummy env) or the DB verifies would crash on the missing channel. A green CI run therefore means the
# same thing a green local run means: zero failures. The only difference is local-only media (the
# sha-bound bed library, gitignored assets), which the verifies skip and health enumerates in its
# "SKIPPED CHECKS" ledger — an explicit, visible delta, never a silent one.
name: health

on:
  push:
    branches: [main]
  pull_request:

jobs:
  health:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ytagent
          POSTGRES_PASSWORD: ytagent
          POSTGRES_DB: ytagent
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ytagent"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # Postgres — point at the service container.
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ytagent
      POSTGRES_PASSWORD: ytagent
      POSTGRES_DB: ytagent
      # load_settings() requires these; CI has no real bot — dummy values keep config loadable.
      TELEGRAM_BOT_TOKEN: ci-dummy-token
      TELEGRAM_CHAT_ID: "0"
      # No ANTHROPIC_API_KEY / provider keys → verify_vision_fixtures and any live check skip cleanly.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ffmpeg (system binary the assembly verifies need)
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Migrate + seed baseline + run the health suite
        run: make PY=python ci
